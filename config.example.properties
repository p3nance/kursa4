# Copy to config.local.properties in the working directory, or set environment variables.
# JVM overrides: -Dtechstore.supabase.url=... -Dtechstore.supabase.key=...
# Only a public publishable key is allowed. Never use a secret or service_role key.
SUPABASE_URL=https://YOUR_PROJECT.supabase.co
SUPABASE_PUBLISHABLE_KEY=YOUR_PUBLIC_PUBLISHABLE_KEY

# Local assistant defaults to hybrid (rules + local Ollama); no API key.
# These settings use environment variables or JVM properties, not this properties file:
# TECHSTORE_CHAT_ENGINE=hybrid  (-Dtechstore.chat.engine=hybrid; rules disables the model)
# TECHSTORE_CHAT_URL=http://127.0.0.1:11434  (-Dtechstore.chat.url=...; loopback only)
# TECHSTORE_CHAT_MODEL=qwen3:14b  (-Dtechstore.chat.model=...; local model name)
